{% set lang = '/' if page.lang == 'en' else '/' ~ page.lang %}

<!DOCTYPE html>
<html lang="{{ page.lang }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">

    <link rel="canonical" href="{{ page.url }}">
    <link rel="stylesheet" href="/assets/tailwind.css">
  </head>
  <body class="font-tiltneo bg-dark-700">
    <script defer src="/assets/ts/time_local.js"></script>
    <script defer src="/assets/ts/main.js"></script>
    <script defer src="/assets/ts/yt_iframe.js"></script>

    {% include "components/navbar.html" %}

    <main class="prose prose-invert w-full max-w-6xl mx-auto py-6 px-4 bg-dark-600 rounded rounded-xl flex-grow mt-8">
      {{ content | safe }}
    </main>

    <footer class="text-center px-6 py-5 text-dark-300">
      <p>&copy; 2026 Snehulak</p>
    </footer>

  </body>
</html>
